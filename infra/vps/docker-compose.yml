# Single-server production stack (ADR-0012): Caddy (HTTPS) → admin portal, Core Platform, Keycloak,
# with MySQL 8.4 and Redis on the same host. Configuration comes from /opt/occpl/.env (written by
# bin/init-env.sh, mode 600); RELEASE (git SHA of the images) is set by bin/deploy.sh.
name: occpl

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
      ADMIN_HOST: admin.${DOMAIN:?set in .env}
      API_HOST: api.${DOMAIN}
      AUTH_HOST: auth.${DOMAIN}
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1/32}
      COURIER_HOST: ${COURIER_HOST:-courier.localhost}   # only used when the courier profile is on
      PORTAL_HOST: ${PORTAL_HOST:-portal.localhost}      # the customer shipping portal, same profile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./extra:/etc/caddy/extra:ro   # extra site blocks (e.g. the public website); not overwritten by the deploy
      - ./site:/srv/site:ro           # static files of the public website
      - caddy-data:/data   # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: occpl_core
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?set in .env}
      DB_KEYCLOAK_PASSWORD: ${DB_KEYCLOAK_PASSWORD:?set in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1   # the migrator creates the audit-log triggers
      - --gtid-mode=ON                        # point-in-time recovery (infra/backup)
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-1G}
      - --max-connections=150
      - --slow-query-log=1
      - --long-query-time=1
    ports:
      - "127.0.0.1:3306:3306"   # backups run on the host
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: ${MYSQL_MEM_LIMIT:-2g}
    stop_grace_period: 60s
    logging: *logging

  redis:
    image: redis:8.10
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 256m
    logging: *logging

  keycloak:
    image: ${IMAGE_PREFIX:?set in .env}-keycloak:${RELEASE:?set by deploy.sh}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_KEYCLOAK_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # Core reaches Keycloak internally, tokens keep the public issuer
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_LOG_CONSOLE_OUTPUT: json
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
      # Substituted into the realm import (first start only).
      KC_PORTAL_URL: https://admin.${DOMAIN}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set in .env}
      PROVISIONING_CLIENT_SECRET: ${PROVISIONING_CLIENT_SECRET:?set in .env}
      KC_SMTP_HOST: ${SMTP_HOST}
      KC_SMTP_PORT: ${SMTP_PORT}
      KC_SMTP_USER: ${SMTP_USERNAME}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD}
      KC_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${SMTP_SSL:-false}
      KC_SMTP_FROM: ${SMTP_FROM_ADDRESS:?set in .env}
    ports:
      - "127.0.0.1:9000:9000"   # management: readiness for deploy.sh
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 40
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1536m}
    stop_grace_period: 30s
    logging: *logging

  core-platform:
    image: ${IMAGE_PREFIX}-core-platform:${RELEASE}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/occpl_core
      DB_USERNAME: occpl_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USERNAME: occpl_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      # Tokens carry the public issuer; keys and admin calls go over the compose network.
      OIDC_ISSUER_URI: https://auth.${DOMAIN}/realms/occpl
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/occpl/protocol/openid-connect/certs
      # The portal, plus any extra comma-separated origins from .env (e.g. the public website's lead form).
      CORS_ALLOWED_ORIGINS: https://admin.${DOMAIN}${CORS_EXTRA_ORIGINS:+,${CORS_EXTRA_ORIGINS}}
      API_DOCS_ENABLED: "false"
      MFA_PLATFORM_REQUIRED: ${MFA_PLATFORM_REQUIRED:-true}   # keep true; false is for the dev server only
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM}
      INVITATION_ACCEPT_URL: https://admin.${DOMAIN}/invitations/accept
      PROVISIONING_CLIENT_SECRET: ${PROVISIONING_CLIENT_SECRET}
      PROVISIONING_TOKEN_URI: http://keycloak:8080/realms/occpl/protocol/openid-connect/token
      PROVISIONING_CALLBACK_BASE_URL: https://api.${DOMAIN}
      PROVISIONING_ALERT_RECIPIENTS: ${PROVISIONING_ALERT_RECIPIENTS:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Company logos and favicons (private S3 bucket). Blank bucket = uploads answer 503, nothing else changes.
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
      FILES_S3_REGION: ${FILES_S3_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${FILES_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${FILES_AWS_SECRET_ACCESS_KEY:-}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8081:8081"   # actuator: readiness for deploy.sh (not public)
    mem_limit: ${CORE_MEM_LIMIT:-2g}
    stop_grace_period: 40s
    logging: *logging

  admin-portal:
    image: ${IMAGE_PREFIX}-admin-portal:${RELEASE}
    restart: unless-stopped
    environment:
      API_BASE_URL: https://api.${DOMAIN}/api/v1
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/occpl
      OIDC_CLIENT_ID: occpl-admin-portal
      CSP_CONNECT_SRC: https://api.${DOMAIN} https://auth.${DOMAIN}
    ports:
      - "127.0.0.1:8088:8080"
    mem_limit: 128m
    logging: *logging

  # --- Courier Management product (optional: runs only when COMPOSE_PROFILES=courier is in .env) ---
  # Uses this server's MySQL (own database and user) and Redis. Set up once with bin/courier-setup.sh.
  courier-backend:
    profiles: [courier]
    image: ${COURIER_BACKEND_IMAGE:-ghcr.io/occplsoftech/courier-service}:${COURIER_BACKEND_RELEASE:-${COURIER_RELEASE:-dev}}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # The browser sends this origin with the sign-in request; the courier answers "Invalid CORS request" for any other.
      APP_CORS_ALLOWEDORIGINS: https://${COURIER_HOST:-courier.localhost},https://${PORTAL_HOST:-portal.localhost}
      # The courier app's public address: staff activation / password-reset links, and the webhook address couriers
      # (Delhivery, Shiprocket) push shipment status updates to (shown in Courier Integrations).
      APP_BASE_URL: https://${COURIER_HOST:-courier.localhost}
      # Where activation and password-reset links for customer-portal accounts point.
      CUSTOMER_PORTAL_BASE_URL: https://${PORTAL_HOST:-portal.localhost}
      # Uploaded files (wallet top-up proof images, proof-of-delivery photos, e-way bills): a private S3 bucket.
      # Off until COURIER_FILES_S3_ENABLED=true and a bucket are set; until then uploads answer "no storage backend is configured".
      # Blank keys = the instance role (if it has the policy). See infra/vps/RUNBOOK.md, section 9.
      AWS_S3_ENABLED: ${COURIER_FILES_S3_ENABLED:-false}
      AWS_S3_BUCKET: ${COURIER_FILES_S3_BUCKET:-}
      AWS_REGION: ${COURIER_FILES_S3_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${COURIER_FILES_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${COURIER_FILES_AWS_SECRET_ACCESS_KEY:-}
      # Customer portal couriers. Blank = shown as "not connected"; the provider's API credentials never go in the image.
      SHIPROCKET_ENABLED: ${SHIPROCKET_ENABLED:-false}
      SHIPROCKET_API_EMAIL: ${SHIPROCKET_API_EMAIL:-}
      SHIPROCKET_API_PASSWORD: ${SHIPROCKET_API_PASSWORD:-}
      SHIPROCKET_PICKUP_LOCATION: ${SHIPROCKET_PICKUP_LOCATION:-}
      DELHIVERY_ENABLED: ${DELHIVERY_ENABLED:-false}
      DELHIVERY_API_TOKEN: ${DELHIVERY_API_TOKEN:-}
      DELHIVERY_PICKUP_LOCATION: ${DELHIVERY_PICKUP_LOCATION:-}
      # Real e-mail (account activation / password reset links, KYC codes, invoices). Off = written to the log.
      # Turning it on needs the SMTP relay below (e.g. smtp.gmail.com:587 with an app password, or the provider's SMTP).
      COMMUNICATION_EMAIL_ENABLED: ${COURIER_EMAIL_ENABLED:-false}
      COMMUNICATION_EMAIL_FROM: ${COURIER_EMAIL_FROM:-}
      COMMUNICATION_EMAIL_FROM_NAME: ${COURIER_EMAIL_FROM_NAME:-OCCPL Courier}
      SPRING_MAIL_HOST: ${COURIER_SMTP_HOST:-}
      SPRING_MAIL_PORT: ${COURIER_SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${COURIER_SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${COURIER_SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${COURIER_SMTP_STARTTLS:-true}
      # Dev server only: also write KYC one-time codes to the log (handy before SMTP/SMS are set up).
      KYC_LOG_CODES: ${COURIER_KYC_LOG_CODES:-false}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: courier_db
      DB_USERNAME: courier
      DB_PASSWORD: ${COURIER_DB_PASSWORD:-}
      DB_POOL_SIZE: "10"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${COURIER_JWT_SECRET:-}
      SECRETS_ENCRYPTION_KEY: ${COURIER_SECRETS_ENCRYPTION_KEY:-}
      # Platform integration: the OCCPL platform provisions companies through /provisioning/v1/**.
      OCCPL_PLATFORM_ENABLED: "true"
      OCCPL_PLATFORM_ISSUER_URI: https://auth.${DOMAIN}/realms/occpl
      OCCPL_PLATFORM_JWK_SET_URI: http://keycloak:8080/realms/occpl/protocol/openid-connect/certs
      OCCPL_PLATFORM_AUDIENCE: courier-api
      OCCPL_PLATFORM_DEFAULT_PLAN_CODE: ${COURIER_DEFAULT_PLAN_CODE:-}
      # "Sign in with OCCPL": the web client people use, and this app's service client for asking Core who may sign in.
      # First start only: creates the courier's first Super Admin; remove both from .env once it exists.
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${COURIER_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${COURIER_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      OCCPL_PLATFORM_WEB_CLIENT_ID: courier-web
      OCCPL_PLATFORM_CORE_BASE_URL: ${OCCPL_PLATFORM_CORE_BASE_URL:-}
      OCCPL_PLATFORM_CORE_TOKEN_URI: ${OCCPL_PLATFORM_CORE_TOKEN_URI:-}
      OCCPL_PLATFORM_SERVICE_CLIENT_ID: courier-service
      OCCPL_PLATFORM_SERVICE_CLIENT_SECRET: ${OCCPL_PLATFORM_SERVICE_CLIENT_SECRET:-}
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    networks:
      default:
        aliases: [backend]   # the courier web image's nginx forwards /api/ to the host name "backend"
    mem_limit: ${COURIER_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    logging: *logging

  courier-frontend:
    profiles: [courier]
    image: ${COURIER_FRONTEND_IMAGE:-ghcr.io/occplsoftech/courier-web}:${COURIER_FRONTEND_RELEASE:-${COURIER_RELEASE:-dev}}
    restart: unless-stopped
    depends_on:
      - courier-backend
    mem_limit: 128m
    logging: *logging

  # Customer shipping portal (business customers book and track shipments). Same courier backend; its nginx
  # forwards /api/ to the host name "backend". Deployed by the e-commerce-bussines repository's Release workflow.
  courier-portal:
    profiles: [courier]
    image: ${PORTAL_IMAGE:-ghcr.io/occplsoftech/e-commerce-business}:${COURIER_PORTAL_RELEASE:-${COURIER_RELEASE:-dev}}
    restart: unless-stopped
    depends_on:
      - courier-backend
    environment:
      # Company whose customers sign in here (blank: the sign-in page asks for a company code).
      PORTAL_COMPANY_CODE: ${PORTAL_COMPANY_CODE:-}
      PORTAL_COMPANY_NAME: ${PORTAL_COMPANY_NAME:-OCCPL SOFTECH}
      PORTAL_SUPPORT_EMAIL: ${PORTAL_SUPPORT_EMAIL:-}
    mem_limit: 128m
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
